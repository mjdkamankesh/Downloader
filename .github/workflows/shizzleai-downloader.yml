
name: ShizzleAI Video Downloader

on:
  workflow_dispatch:
    inputs:
      max_pages:
        description: "Number of pages to scan"
        required: true
        default: "6"
        type: string
      zip_password:
        description: "Password for ZIP archives"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: shizzleai-downloader
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      MAX_PAGES: ${{ inputs.max_pages }}
      ZIP_PASSWORD: ${{ inputs.zip_password }}
      PYTHONUNBUFFERED: "1"

    steps:
      # ---------------------------------------
      # CHECKOUT
      # ---------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Mask password
        run: echo "::add-mask::$ZIP_PASSWORD"

      # ---------------------------------------
      # INSTALL CLOUDFLARE WARP
      # ---------------------------------------

      - name: Install Cloudflare WARP
        shell: bash
        run: |
          set -e

          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg |
            sudo gpg --yes --dearmor \
              -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg

          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(. /etc/os-release && echo "$VERSION_CODENAME") main" |
            sudo tee /etc/apt/sources.list.d/cloudflare-client.list

          sudo apt-get update
          sudo apt-get install -y cloudflare-warp

          sudo systemctl enable --now warp-svc

          warp-cli --accept-tos registration new

          warp-cli mode warp+doh
          warp-cli connect

          echo "Waiting for WARP connection..."

          CONNECTED=0

          for i in $(seq 1 30); do
            if curl -fsS --max-time 10 \
              https://www.cloudflare.com/cdn-cgi/trace |
              grep -q "warp=on"; then

              CONNECTED=1
              break
            fi

            sleep 5
          done

          if [ "$CONNECTED" -ne 1 ]; then
            echo "WARP connection could not be verified."
            warp-cli status || true
            exit 1
          fi

          echo "Cloudflare WARP is connected."

      # ---------------------------------------
      # PYTHON
      # ---------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg p7zip-full

          python -m pip install --upgrade pip
          pip install -U yt-dlp playwright

          python -m playwright install --with-deps chromium

      # ---------------------------------------
      # EMBEDDED DOWNLOADER
      # ---------------------------------------

      - name: Run ShizzleAI downloader
        shell: bash
        run: |
          cat > /tmp/shizzleai_downloader.py <<'PYTHON'
          import os
          import re
          import json
          import asyncio
          from urllib.parse import urljoin, urlparse, parse_qs

          from playwright.async_api import async_playwright
          from yt_dlp import YoutubeDL

          START_URL = (
              "https://rule34gen.com/search/shizzleai-/"
              "?sort_by=post_date"
          )

          OUTPUT_DIR = "ShizzleAI_Videos"
          ARCHIVE_FILE = "downloaded.txt"
          FAILED_FILE = "failed.txt"
          LINKS_FILE = "video_links.txt"

          MAX_PAGES = max(1, int(os.getenv("MAX_PAGES", "6")))

          os.makedirs(OUTPUT_DIR, exist_ok=True)

          def valid_video_url(url):
              try:
                  parsed = urlparse(url)

                  host = (parsed.hostname or "").lower()

                  return (
                      host == "rule34gen.com"
                      or host.endswith(".rule34gen.com")
                  ) and re.search(
                      r"/video/\d+/?",
                      parsed.path,
                      re.IGNORECASE
                  ) is not None

              except Exception:
                  return False

          async def extract_links(page):
              # Try multiple selectors instead of relying on one CSS class.
              selectors = [
                  "a.th.js-open-popup[href]",
                  "a[href*='/video/']",
                  "a[href*='video']"
              ]

              found = []

              for selector in selectors:
                  try:
                      items = await page.locator(selector).evaluate_all(
                          "(els) => els.map(e => e.href)"
                      )

                      for url in items:
                          if valid_video_url(url) and url not in found:
                              found.append(url)

                  except Exception as error:
                      print(f"Selector error ({selector}): {error}")

              # Also inspect all anchors as a fallback.
              try:
                  anchors = await page.locator("a[href]").evaluate_all(
                      "(els) => els.map(e => e.href)"
                  )

                  for url in anchors:
                      if valid_video_url(url) and url not in found:
                          found.append(url)

              except Exception as error:
                  print(f"Anchor scan error: {error}")

              return found

          async def get_next_page(page, current_url):
              try:
                  href = await page.locator(
                      'a[rel="next"]'
                  ).first.get_attribute("href")

                  if href:
                      return urljoin(current_url, href)

              except Exception:
                  pass

              try:
                  anchors = await page.locator("a[href]").evaluate_all("""
                      els => els.map(a => ({
                          href: a.getAttribute('href'),
                          text: (
                              a.innerText ||
                              a.getAttribute('aria-label') ||
                              ''
                          ).trim()
                      }))
                  """)

                  current = int(
                      parse_qs(urlparse(current_url).query)
                      .get("page", ["1"])[0]
                  )

                  candidates = []

                  for item in anchors:
                      label = item["text"].strip().lower()

                      if not item["href"]:
                          continue

                      if label in (
                          "next", "next page", "›", "»", "→", ">"
                      ):
                          return urljoin(current_url, item["href"])

                      if label.isdigit() and int(label) > current:
                          candidates.append(
                              (int(label), item["href"])
                          )

                  if candidates:
                      candidates.sort(key=lambda x: x[0])
                      return urljoin(
                          current_url,
                          candidates[0][1]
                      )

              except Exception as error:
                  print(f"Pagination error: {error}")

              return None

          async def collect_links():
              all_links = []
              visited = set()

              async with async_playwright() as p:
                  browser = await p.chromium.launch(
                      headless=True,
                      args=[
                          "--no-sandbox",
                          "--disable-dev-shm-usage"
                      ]
                  )

                  context = await browser.new_context(
                      viewport={"width": 1366, "height": 900},
                      user_agent=(
                          "Mozilla/5.0 (X11; Linux x86_64) "
                          "AppleWebKit/537.36 "
                          "(KHTML, like Gecko) "
                          "Chrome/130.0.0.0 Safari/537.36"
                      )
                  )

                  page = await context.new_page()
                  page.set_default_timeout(30000)

                  current_url = START_URL

                  for number in range(1, MAX_PAGES + 1):
                      if not current_url or current_url in visited:
                          break

                      visited.add(current_url)

                      print(f"\nScanning page {number}: {current_url}")

                      try:
                          response = await page.goto(
                              current_url,
                              wait_until="domcontentloaded",
                              timeout=90000
                          )

                          print(
                              "HTTP STATUS:",
                              response.status if response else "No response"
                          )

                          await page.wait_for_timeout(7000)

                          print("PAGE TITLE:", await page.title())
                          print("FINAL URL:", page.url)

                          links = await extract_links(page)

                          print(f"Found {len(links)} video links.")

                          if number == 1:
                              # Save diagnostics for the first page.
                              with open(
                                  "debug_page.html",
                                  "w",
                                  encoding="utf-8"
                              ) as f:
                                  f.write(await page.content())

                              with open(
                                  "debug_text.txt",
                                  "w",
                                  encoding="utf-8"
                              ) as f:
                                  f.write(
                                      await page.locator(
                                          "body"
                                      ).inner_text()
                                  )

                              await page.screenshot(
                                  path="debug_page.png",
                                  full_page=True
                              )

                          for link in links:
                              if link not in all_links:
                                  all_links.append(link)

                          next_url = await get_next_page(
                              page,
                              current_url
                          )

                          if not next_url or next_url in visited:
                              break

                          current_url = next_url

                      except Exception as error:
                          print(f"Page scan error: {error}")
                          break

                  await browser.close()

              # Preserve previous links and append new ones.
              previous = []

              if os.path.exists(LINKS_FILE):
                  with open(
                      LINKS_FILE,
                      "r",
                      encoding="utf-8"
                  ) as f:
                      previous = [
                          x.strip() for x in f
                          if x.strip()
                      ]

              combined = list(dict.fromkeys(previous + all_links))

              with open(
                  LINKS_FILE,
                  "w",
                  encoding="utf-8"
              ) as f:
                  f.write("\n".join(combined))

              print(f"\nNew links: {len(all_links)}")
              print(f"Total saved links: {len(combined)}")

              return combined

          def download_videos(links):
              options = {
                  "format": "bestvideo*+bestaudio/best",
                  "merge_output_format": "mp4",
                  "outtmpl": os.path.join(
                      OUTPUT_DIR,
                      "%(title).120B_%(id)s.%(ext)s"
                  ),
                  "download_archive": ARCHIVE_FILE,
                  "continuedl": True,
                  "retries": 10,
                  "fragment_retries": 10,
                  "extractor_retries": 5,
                  "file_access_retries": 5,
                  "noplaylist": True,
                  "quiet": False,
                  "no_warnings": False,
                  "overwrites": False,
                  "ignoreerrors": True,
              }

              failed = []

              if os.path.exists(FAILED_FILE):
                  with open(
                      FAILED_FILE,
                      "r",
                      encoding="utf-8"
                  ) as f:
                      failed = [
                          x.strip() for x in f
                          if x.strip()
                      ]

              failed = list(dict.fromkeys(failed))

              with YoutubeDL(options) as ydl:
                  for index, link in enumerate(links, start=1):
                      print(
                          f"\nDownloading {index}/{len(links)}: {link}"
                      )

                      try:
                          result = ydl.download([link])

                          if result != 0:
                              failed.append(link)

                          else:
                              failed = [
                                  x for x in failed if x != link
                              ]

                      except Exception as error:
                          print(f"Download error: {error}")

                          if link not in failed:
                              failed.append(link)

                      with open(
                          FAILED_FILE,
                          "w",
                          encoding="utf-8"
                      ) as f:
                          f.write("\n".join(failed))

              print(f"\nFailed links: {len(failed)}")

          async def main():
              links = await collect_links()

              if not links:
                  print("No video links found.")
                  print("Check debug_page.html and debug_text.txt.")
                  return

              download_videos(links)

          if __name__ == "__main__":
              asyncio.run(main())
          PYTHON

          python -u /tmp/shizzleai_downloader.py

      # ---------------------------------------
      # SAVE DEBUG FILES
      # ---------------------------------------

      - name: Upload diagnostic files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shizzleai-debug-${{ github.run_number }}
          path: |
            debug_page.html
            debug_page.png
            debug_text.txt
          if-no-files-found: ignore
          retention-days: 3

      # ---------------------------------------
      # DISCONNECT WARP
      # ---------------------------------------

      - name: Disconnect WARP
        if: always()
        run: |
          warp-cli disconnect || true

      # ---------------------------------------
      # CREATE ENCRYPTED SPLIT ZIP FILES
      # ---------------------------------------

      - name: Create encrypted archives
        shell: bash
        run: |
          set -e

          mkdir -p videos
          shopt -s nullglob

          for FILE in ShizzleAI_Videos/*; do
            [ -f "$FILE" ] || continue

            case "${FILE,,}" in
              *.mp4|*.mkv|*.webm|*.mov|*.avi|*.m4v)
                ;;
              *)
                continue
                ;;
            esac

            BASENAME=$(basename "$FILE")
            SAFE_NAME=$(echo "$BASENAME" |
              sed 's/[^a-zA-Z0-9._-]/_/g')

            DEST="videos/$SAFE_NAME"

            if [ -f "$DEST/README.md" ]; then
              echo "Already archived: $SAFE_NAME"
              continue
            fi

            mkdir -p "$DEST"

            echo "Archiving: $SAFE_NAME"

            7z a \
              -tzip \
              -v45m \
              -p"$ZIP_PASSWORD" \
              -mem=AES256 \
              -mx=0 \
              "$DEST/$SAFE_NAME.zip" \
              "$FILE"

            {
              echo "# $SAFE_NAME"
              echo ""
              echo "Password-protected ZIP archive."
              echo "Split size: 45 MB"
              echo ""
              echo "Download all parts in this folder."
              echo "Open the final .zip file to extract."
              echo ""
              echo "## Archive parts"
              echo ""
              for PART in "$DEST"/*.z[0-9]* "$DEST"/*.zip; do
                [ -f "$PART" ] || continue
                echo "- $(basename "$PART")"
              done
            } > "$DEST/README.md"

          done

      # ---------------------------------------
      # UPLOAD DOWNLOADED VIDEOS AS ARTIFACT
      # ---------------------------------------

      - name: Upload video files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shizzleai-downloaded-${{ github.run_number }}
          path: ShizzleAI_Videos/
          if-no-files-found: warn
          retention-days: 7

      # ---------------------------------------
      # COMMIT WITHOUT FORCE PUSH
      # ---------------------------------------

      - name: Commit and push
        if: success()
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A videos/

          for FILE in downloaded.txt video_links.txt failed.txt; do
            if [ -f "$FILE" ]; then
              git add "$FILE"
            fi
          done

          if git diff --cached --quiet; then
            echo "No new files to commit."
            exit 0
          fi

          git commit -m "Add ShizzleAI video archives"

          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"

          git push origin "HEAD:$GITHUB_REF_NAME"

          echo "Upload completed successfully."
