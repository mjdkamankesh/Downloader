name: ShizzleAI Downloader

on:
  workflow_dispatch:
    inputs:
      max_pages:
        description: "Maximum number of pages to crawl"
        required: false
        default: "30"
        type: string

permissions:
  contents: read

concurrency:
  group: shizzleai-downloader
  cancel-in-progress: false

jobs:
  download:
    name: Run downloader
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      MAX_PAGES: ${{ github.event.inputs.max_pages || '30' }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Verify Chrome
        run: |
          google-chrome --version || chromium --version || true

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install selenium webdriver-manager
          fi

      - name: Locate downloader script
        id: locate
        run: |
          SCRIPT=""
          for candidate in \
            "shizzleai_downloader.py" \
            "scripts/shizzleai_downloader.py" \
            "src/shizzleai_downloader.py" \
            "downloader/shizzleai_downloader.py" \
            "app/shizzleai_downloader.py"; do
            if [ -f "$candidate" ]; then
              SCRIPT="$candidate"
              break
            fi
          done

          if [ -z "$SCRIPT" ]; then
            echo "ERROR: shizzleai_downloader.py not found!"
            echo "--- files in repo root ---"
            ls -la
            echo "--- searching whole repo ---"
            find . -name "shizzleai_downloader.py" -not -path "./.git/*" || true
            exit 1
          fi

          echo "Found script at: $SCRIPT"
          echo "script=$SCRIPT" >> "$GITHUB_OUTPUT"

      - name: Prepare downloader
        env:
          SCRIPT: ${{ steps.locate.outputs.script }}
        run: |
          # GitHub Actions has no desktop display
          sed -i 's/headless=False/headless=True/g' "$SCRIPT"

          # Allow page count to be controlled from workflow input
          sed -i 's/MAX_PAGES = 30/MAX_PAGES = int(os.getenv("MAX_PAGES") or "30")/g' "$SCRIPT"

          # Ensure `import os` exists (needed for os.getenv)
          if ! grep -qE '^\s*import\s+os\b|^\s*from\s+os\s+import' "$SCRIPT"; then
            sed -i '1i import os' "$SCRIPT"
          fi

          # Optional: force webdriver-manager if your script uses ChromeDriver
          # (uncomment if you get driver errors)
          # sed -i "s/from selenium import webdriver/from selenium import webdriver\nfrom webdriver_manager.chrome import ChromeDriverManager\nfrom selenium.webdriver.chrome.service import Service/" "$SCRIPT"

          mkdir -p ShizzleAI_Videos videos

          echo "--- sanity checks ---"
          grep -n "headless" "$SCRIPT" | head -n 5 || true
          grep -n "MAX_PAGES" "$SCRIPT" | head -n 5 || true

      - name: Run downloader
        env:
          SCRIPT: ${{ steps.locate.outputs.script }}
        run: |
          python "$SCRIPT"

      - name: List produced files
        if: always()
        run: |
          echo "--- ShizzleAI_Videos ---"
          ls -la ShizzleAI_Videos 2>/dev/null || true
          echo "--- videos ---"
          ls -la videos 2>/dev/null || true

      - name: Upload videos as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shizzleai-videos-${{ github.run_number }}
          path: |
            ShizzleAI_Videos/
            videos/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6
