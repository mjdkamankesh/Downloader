name: ShizzleAI Auto Downloader

on:
  workflow_dispatch:
    inputs:
      start_url:
        description: "Starting search URL"
        required: true
        type: string
        default: "https://rule34gen.com/search/shizzleai-/?sort_by=post_date"

permissions:
  contents: write

concurrency:
  group: shizzleai-download-${{ github.ref }}
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      START_URL: ${{ inputs.start_url }}
      ZIP_PASSWORD: ${{ secrets.ZIP_PASSWORD }}
      DOWNLOAD_DIR: ShizzleAI_Videos
      TEMP_DIR: temp_downloads

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config http.version HTTP/1.1
          git config http.postBuffer 524288000
          git config core.compression 0
          git config pack.threads 1

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 p7zip-full git unzip ffmpeg

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install playwright yt-dlp

      - name: Install Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Prepare folders
        run: |
          mkdir -p temp_downloads
          mkdir -p debug
          mkdir -p ShizzleAI_Videos

          if [ -z "$ZIP_PASSWORD" ]; then
            echo "ZIP_PASSWORD secret is not configured."
            exit 1
          fi

      - name: Extract all video links
        run: |
          cat > extract_links.py <<'PY'
          import asyncio
          import os
          import re
          from urllib.parse import urlparse, urljoin
          from playwright.async_api import async_playwright

          START_URL = os.environ["START_URL"]
          MAX_PAGES = 30

          def is_video_url(url):
              parsed = urlparse(url)
              return (
                  parsed.hostname == "rule34gen.com"
                  and bool(re.match(r"^/video/\d+/", parsed.path))
              )

          async def extract_video_links():
              video_links = set()
              visited_pages = set()

              async with async_playwright() as p:
                  browser = await p.chromium.launch(
                      headless=True,
                      args=["--no-sandbox", "--disable-dev-shm-usage"]
                  )

                  page = await browser.new_page()
                  current_url = START_URL

                  for page_number in range(1, MAX_PAGES + 1):
                      if not current_url or current_url in visited_pages:
                          break

                      visited_pages.add(current_url)

                      print(f"\nScanning page {page_number}: {current_url}")

                      try:
                          response = await page.goto(
                              current_url,
                              wait_until="domcontentloaded",
                              timeout=60000
                          )

                          await page.wait_for_timeout(3000)

                          print(
                              "HTTP status:",
                              response.status if response else "Unknown"
                          )
                          print("Final URL:", page.url)
                          print("Page title:", await page.title())

                          # استفاده از سلکتور اصلی اسکریپت کاربر
                          links = await page.locator(
                              "a.th.js-open-popup[href]"
                          ).evaluate_all(
                              "els => els.map(a => a.href)"
                          )

                          # فیلتر لینک‌های ویدئو
                          for link in links:
                              if is_video_url(link):
                                  video_links.add(link)

                          print(
                              f"Cards: {len(links)} | "
                              f"Total videos: {len(video_links)}"
                          )

                          # پیدا کردن دکمه Next
                          next_url = await page.locator(
                              "a[href]"
                          ).evaluate_all("""
                              els => {
                                  const a = els.find(x => {
                                      const t = x.innerText.trim().toLowerCase();
                                      return t === 'next' ||
                                             t === 'next »' ||
                                             t === 'next ›';
                                  });
                                  return a ? a.href : null;
                              }
                          """)

                          # اگر Next نبود، شماره صفحه بعدی را پیدا کن
                          if not next_url:
                              page_links = await page.locator(
                                  "a[href]"
                              ).evaluate_all("""
                                  els => els.map(a => ({
                                      text: a.innerText.trim(),
                                      href: a.href
                                  }))
                              """)

                              candidates = []

                              for item in page_links:
                                  if item["text"].isdigit():
                                      number = int(item["text"])

                                      if number > page_number:
                                          candidates.append(
                                              (number, item["href"])
                                          )

                              if candidates:
                                  candidates.sort()
                                  next_url = candidates[0][1]

                          if next_url:
                              next_url = urljoin(current_url, next_url)

                          if not next_url or next_url == current_url:
                              print("Last page reached.")
                              break

                          current_url = next_url

                      except Exception as error:
                          print("Page error:", error)
                          break

                  await browser.close()

              with open("video_links.txt", "w", encoding="utf-8") as f:
                  for link in sorted(video_links):
                      f.write(link + "\n")

              print("\nTotal unique video links:", len(video_links))

          asyncio.run(extract_video_links())
          PY

          python extract_links.py

          if [ ! -s video_links.txt ]; then
            echo "No video links found."
            exit 1
          fi

          echo "Extracted video links:"
          cat video_links.txt

      - name: Download videos with Aria2
        id: download
        run: |
          set +e

          mkdir -p temp_downloads
          ARCHIVE="$RUNNER_TEMP/shizzle-download-archive.txt"
          touch "$ARCHIVE"

          SUCCESS=0
          FAILED=0
          TOTAL=0

          while IFS= read -r URL || [ -n "$URL" ]; do
            [ -z "$URL" ] && continue

            TOTAL=$((TOTAL + 1))

            echo ""
            echo "======================================"
            echo "Video $TOTAL"
            echo "$URL"
            echo "======================================"

            if yt-dlp \
              --no-overwrites \
              --download-archive "$ARCHIVE" \
              --retries 10 \
              --fragment-retries 10 \
              --file-access-retries 10 \
              --extractor-retries 5 \
              --socket-timeout 60 \
              --continue \
              --downloader aria2c \
              --downloader-args "aria2c:-x 16 -s 16 -k 1M --file-allocation=none --retry-wait=5 --max-tries=10 --connect-timeout=30 --timeout=60" \
              -f "bestvideo+bestaudio/best" \
              --merge-output-format mp4 \
              -o "temp_downloads/%(title).150B_%(id)s.%(ext)s" \
              "$URL"; then

              SUCCESS=$((SUCCESS + 1))
              echo "RESULT: SUCCESS"
            else
              FAILED=$((FAILED + 1))
              echo "$URL" >> failed.txt
              echo "RESULT: FAILED"
            fi

          done < video_links.txt

          echo ""
          echo "======================================"
          echo "Download summary"
          echo "Total: $TOTAL"
          echo "Successful: $SUCCESS"
          echo "Failed: $FAILED"
          echo "======================================"

          echo "success=$SUCCESS" >> "$GITHUB_OUTPUT"
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"

          if [ "$SUCCESS" -eq 0 ]; then
            echo "No new video was downloaded successfully."
            exit 1
          fi

      - name: Create AES-256 ZIP archives
        if: success()
        run: |
          set -e

          mkdir -p ShizzleAI_Videos
          shopt -s nullglob

          for FILE in temp_downloads/*; do
            [ -f "$FILE" ] || continue

            case "$FILE" in
              *.mp4|*.mkv|*.webm|*.mov|*.avi) ;;
              *) continue ;;
            esac

            BASENAME=$(basename "$FILE")
            NAME="${BASENAME%.*}"
            ZIP_PATH="ShizzleAI_Videos/${NAME}.zip"

            echo "Creating AES-256 ZIP: $ZIP_PATH"

            rm -f "$ZIP_PATH" "$ZIP_PATH".part-*

            7z a \
              -tzip \
              "-p${ZIP_PASSWORD}" \
              -mem=AES256 \
              -mx=0 \
              -y \
              "$ZIP_PATH" \
              "$FILE"

            7z t "-p${ZIP_PASSWORD}" "$ZIP_PATH"

            split -b 45M -d -a 3 \
              "$ZIP_PATH" \
              "$ZIP_PATH.part-"

            rm -f "$ZIP_PATH"

            cat > "ShizzleAI_Videos/${NAME}_README.txt" <<EOF
          Video: $BASENAME
          Encryption: AES-256
          Split size: 45 MB

          Extraction:
          1. Keep all parts in the same folder.
          2. Run:
             cat "${NAME}.zip.part-"* > "${NAME}.zip"
          3. Open the reconstructed ZIP with 7-Zip.
          4. Enter your ZIP password.
          EOF

            echo "Archive completed:"
            ls -lh "$ZIP_PATH".part-*
          done

      - name: Generate report
        if: always()
        run: |
          cat > ShizzleAI_Videos/README.md <<EOF
          # ShizzleAI Downloads

          - Starting URL: ${START_URL}
          - Successful downloads: ${{ steps.download.outputs.success }}
          - Failed downloads: ${{ steps.download.outputs.failed }}
          - Encryption: AES-256
          - Split size: 45 MB

          Each video is stored in its own encrypted ZIP archive.
          EOF

          echo "Generated files:"
          find ShizzleAI_Videos -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Commit and push with retries
        if: always()
        run: |
          set +e

          BRANCH="${GITHUB_REF_NAME}"
          MAX_RETRIES=8
          ATTEMPT=1

          git add ShizzleAI_Videos failed.txt 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi

          git commit -m "Add ShizzleAI video downloads"

          if [ $? -ne 0 ]; then
            echo "Commit failed."
            exit 1
          fi

          while [ "$ATTEMPT" -le "$MAX_RETRIES" ]; do
            echo "Push attempt $ATTEMPT of $MAX_RETRIES"

            git -c http.postBuffer=524288000 \
                -c http.version=HTTP/1.1 \
                push origin "HEAD:${BRANCH}"

            if [ $? -eq 0 ]; then
              echo "Push successful."
              exit 0
            fi

            echo "Push failed. Fetching remote changes..."

            git fetch origin "$BRANCH"

            if [ $? -eq 0 ]; then
              git rebase "origin/${BRANCH}"

              if [ $? -ne 0 ]; then
                echo "Rebase failed."
                git rebase --abort
              fi
            fi

            WAIT_TIME=$((ATTEMPT * 10))
            sleep "$WAIT_TIME"
            ATTEMPT=$((ATTEMPT + 1))
          done

          echo "Push failed after all retries."
          exit 1

      - name: Upload debug information
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shizzleai-debug
          path: |
            debug/
            video_links.txt
            failed.txt
          if-no-files-found: ignore
          retention-days: 3

