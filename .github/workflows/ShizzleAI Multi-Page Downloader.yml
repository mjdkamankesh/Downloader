
name: ShizzleAI Pages 1-6 Downloader defaults
  
on:
  workflow_dispatch:
    inputs:
      page_number:
        description: "Select page"
        required: true
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"
          - "5"
          - "6"
        default: "1"

      test_only:
        description: "Test mode: download only one video"
        required: true
        type: boolean
        default: true

      zip_password:
        description: "Password for AES-256 ZIP files"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: shizzleai-download-${{ github.ref }}
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      PAGE_NUMBER: ${{ inputs.page_number }}
      TEST_ONLY: ${{ inputs.test_only }}
      ZIP_PASSWORD: ${{ inputs.zip_password }}
      START_URL: https://rule34gen.com/search/shizzleai-/?sort_by=post_date

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git config http.version HTTP/1.1
          git config http.postBuffer 524288000
          git config http.maxRequestBuffer 100M
          git config core.compression 0
          git config pack.windowMemory 100m
          git config pack.packSizeLimit 100m
          git config pack.threads 1

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            aria2 \
            p7zip-full \
            git \
            unzip \
            ffmpeg

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install playwright yt-dlp pyzipper

      - name: Install Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Prepare folders
        run: |
          mkdir -p temp_downloads
          mkdir -p debug
          mkdir -p "ShizzleAI_Videos/Page_${PAGE_NUMBER}"

          if [ -z "$ZIP_PASSWORD" ]; then
            echo "ZIP password is empty."
            exit 1
          fi

          echo "Selected page: ${PAGE_NUMBER}"
          echo "Test mode: ${TEST_ONLY}"

      - name: Extract video links
        run: |
          cat > extract_links.py <<'PY'
          import os
          from playwright.sync_api import sync_playwright

          page_number = int(os.environ["PAGE_NUMBER"])
          start_url = os.environ["START_URL"]

          if page_number == 1:
              url = start_url
          else:
              separator = "&" if "?" in start_url else "?"
              url = f"{start_url}{separator}page={page_number}"

          print(f"Opening: {url}")

          links = []

          with sync_playwright() as p:
              browser = p.chromium.launch(
                  headless=True,
                  args=["--no-sandbox", "--disable-dev-shm-usage"]
              )

              context = browser.new_context(
                  user_agent=(
                      "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                      "AppleWebKit/537.36 (KHTML, like Gecko) "
                      "Chrome/120.0.0.0 Safari/537.36"
                  )
              )

              page = context.new_page()
              page.set_default_timeout(30000)

              try:
                  page.goto(
                      url,
                      wait_until="domcontentloaded",
                      timeout=120000
                  )
                  page.wait_for_timeout(10000)

                  page.screenshot(
                      path="debug/page.png",
                      full_page=True
                  )

                  with open("debug/page.html", "w", encoding="utf-8") as f:
                      f.write(page.content())

                  selectors = [
                      "a.th.js-open-popup[href]",
                      "a[href*='/video/']"
                  ]

                  for selector in selectors:
                      elements = page.locator(selector).all()

                      for element in elements:
                          href = element.get_attribute("href")

                          if not href:
                              continue

                          if href.startswith("/"):
                              href = "https://rule34gen.com" + href

                          if "/video/" in href and href not in links:
                              links.append(href)

              except Exception as e:
                  print(f"Page extraction error: {e}")
                  page.screenshot(
                      path="debug/error.png",
                      full_page=True
                  )

              finally:
                  browser.close()

          with open("video_links.txt", "w", encoding="utf-8") as f:
              for link in links:
                  f.write(link + "\n")

          print(f"Found {len(links)} video links")
          PY

          python extract_links.py

          if [ ! -s video_links.txt ]; then
            echo "No video links found."
            exit 1
          fi

          echo "Extracted links:"
          cat video_links.txt

      - name: Download, ZIP and Push each video
        id: download
        run: |
          set -Eeuo pipefail

          PAGE_DIR="ShizzleAI_Videos/Page_${PAGE_NUMBER}"
          mkdir -p "$PAGE_DIR" temp_downloads

          ARCHIVE="$PAGE_DIR/downloaded.txt"
          FAILED_FILE="$PAGE_DIR/failed.txt"

          touch "$ARCHIVE"

          BRANCH="${GITHUB_REF_NAME}"
          MAX_RETRIES=8

          SUCCESS=0
          FAILED=0
          SKIPPED=0
          TOTAL=0

          while IFS= read -r URL || [ -n "$URL" ]; do
            [ -z "$URL" ] && continue

            TOTAL=$((TOTAL + 1))

            if [ "$TEST_ONLY" = "true" ] && [ "$TOTAL" -gt 1 ]; then
              echo "Test mode: stopping after first video."
              break
            fi

            echo ""
            echo "======================================"
            echo "Video $TOTAL"
            echo "$URL"
            echo "======================================"

            # Extract video ID from URL
            VIDEO_ID=$(echo "$URL" | sed -nE 's#^.*/video/([0-9]+)/.*#\1#p')

            if [ -z "$VIDEO_ID" ]; then
              echo "Could not identify video ID."
              FAILED=$((FAILED + 1))
              echo "$URL" >> "$FAILED_FILE"
              continue
            fi

            # Skip videos already present in the download archive
            if grep -qE "[[:space:]]${VIDEO_ID}$" "$ARCHIVE"; then
              echo "Already downloaded: $VIDEO_ID"
              SKIPPED=$((SKIPPED + 1))
              continue
            fi

            # Clean temporary files from previous video
            rm -f temp_downloads/*

            # Download one video
            echo "Starting download..."

            if ! yt-dlp \
              --no-overwrites \
              --retries 10 \
              --fragment-retries 10 \
              --file-access-retries 10 \
              --extractor-retries 5 \
              --socket-timeout 60 \
              --continue \
              --downloader aria2c \
              --downloader-args "aria2c:-x 16 -s 16 -k 1M --file-allocation=none --retry-wait=5 --max-tries=10 --connect-timeout=30 --timeout=60" \
              -f "bestvideo+bestaudio/best" \
              --merge-output-format mp4 \
              -o "temp_downloads/%(title).150B_%(id)s.%(ext)s" \
              "$URL"; then

              echo "Download failed."
              FAILED=$((FAILED + 1))
              echo "$URL" >> "$FAILED_FILE"
              continue
            fi

            # Locate downloaded video
            shopt -s nullglob
            VIDEO_FILES=(
              temp_downloads/*.mp4
              temp_downloads/*.mkv
              temp_downloads/*.webm
              temp_downloads/*.mov
              temp_downloads/*.avi
            )

            if [ "${#VIDEO_FILES[@]}" -eq 0 ]; then
              echo "Downloaded file not found."
              FAILED=$((FAILED + 1))
              echo "$URL" >> "$FAILED_FILE"
              continue
            fi

            FILE="${VIDEO_FILES[0]}"
            BASENAME=$(basename "$FILE")
            NAME="${BASENAME%.*}"
            ZIP_PATH="$PAGE_DIR/${NAME}.zip"

            echo "Downloaded: $BASENAME"

            # Create AES-256 ZIP
            echo "Creating encrypted ZIP..."

            rm -f "$ZIP_PATH" "$ZIP_PATH".part-*

            if ! 7z a \
              -tzip \
              "-p${ZIP_PASSWORD}" \
              -mem=AES256 \
              -mx=0 \
              -y \
              "$ZIP_PATH" \
              "$FILE"; then

              echo "ZIP creation failed."
              FAILED=$((FAILED + 1))
              echo "$URL" >> "$FAILED_FILE"
              continue
            fi

            # Verify ZIP
            if ! 7z t "-p${ZIP_PASSWORD}" "$ZIP_PATH"; then
              echo "ZIP verification failed."
              rm -f "$ZIP_PATH"
              FAILED=$((FAILED + 1))
              echo "$URL" >> "$FAILED_FILE"
              continue
            fi

            # Split into 45 MB parts
            echo "Splitting ZIP..."

            if ! split -b 45M -d -a 3 \
              "$ZIP_PATH" \
              "$ZIP_PATH.part-"; then

              echo "ZIP splitting failed."
              rm -f "$ZIP_PATH" "$ZIP_PATH".part-*
              FAILED=$((FAILED + 1))
              echo "$URL" >> "$FAILED_FILE"
              continue
            fi

            # Verify split files exist
            PARTS=( "$ZIP_PATH".part-* )

            if [ "${#PARTS[@]}" -eq 0 ]; then
              echo "No ZIP parts created."
              FAILED=$((FAILED + 1))
              echo "$URL" >> "$FAILED_FILE"
              continue
            fi

            # Remove original ZIP and downloaded video
            rm -f "$ZIP_PATH" "$FILE"

            # Create README for this video
            cat > "$PAGE_DIR/${NAME}_README.txt" <<EOF
          Video: $BASENAME
          Encryption: AES-256
          Split size: 45 MB

          Reassemble on Linux:
          cat "${NAME}.zip.part-"* > "${NAME}.zip"

          Open the reconstructed ZIP using 7-Zip and enter the password.
          EOF

            echo "ZIP parts created:"
            ls -lh "$ZIP_PATH".part-*

            # Add only this video's files and archive record
            git add "$PAGE_DIR"

            if git diff --cached --quiet; then
              echo "No staged changes found."
              FAILED=$((FAILED + 1))
              continue
            fi

            # Commit this video separately
            git commit -m "Add ShizzleAI video ${VIDEO_ID}"

            echo "Pushing video ${VIDEO_ID}..."

            ATTEMPT=1
            PUSHED=false

            while [ "$ATTEMPT" -le "$MAX_RETRIES" ]; do
              echo "Push attempt $ATTEMPT of $MAX_RETRIES"

              if git -c http.postBuffer=524288000 \
                     -c http.version=HTTP/1.1 \
                     push origin "HEAD:${BRANCH}"; then

                PUSHED=true
                break
              fi

              echo "Push failed."

              # Check whether remote branch moved.
              if ! git fetch origin "$BRANCH"; then
                echo "Fetch failed. Retrying same commit."
              else
                LOCAL_HEAD=$(git rev-parse HEAD)
                REMOTE_HEAD=$(git rev-parse "origin/${BRANCH}")

                if [ "$LOCAL_HEAD" != "$REMOTE_HEAD" ]; then
                  if git merge-base --is-ancestor "$LOCAL_HEAD" "$REMOTE_HEAD"; then
                    echo "Remote already contains this commit."
                    PUSHED=true
                    break
                  fi

                  if git merge-base --is-ancestor "$REMOTE_HEAD" "$LOCAL_HEAD"; then
                    echo "Local commit is ahead. Retrying push."
                  else
                    echo "Remote has independent changes. Rebasing..."
                    if ! git rebase "origin/${BRANCH}"; then
                      echo "Rebase failed."
                      git rebase --abort || true
                      exit 1
                    fi
                  fi
                fi
              fi

              WAIT_TIME=$((ATTEMPT * 10))
              echo "Waiting ${WAIT_TIME} seconds..."
              sleep "$WAIT_TIME"

              ATTEMPT=$((ATTEMPT + 1))
            done

            if [ "$PUSHED" != "true" ]; then
              echo "Push failed after all retries."
              exit 1
            fi

            SUCCESS=$((SUCCESS + 1))
            echo "Video ${VIDEO_ID} successfully pushed."

          done < video_links.txt

          # Save summary
          echo "success=$SUCCESS" >> "$GITHUB_OUTPUT"
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"
          echo "skipped=$SKIPPED" >> "$GITHUB_OUTPUT"

          echo ""
          echo "======================================"
          echo "FINAL SUMMARY"
          echo "Processed: $TOTAL"
          echo "Successfully pushed: $SUCCESS"
          echo "Skipped: $SKIPPED"
          echo "Failed: $FAILED"
          echo "======================================"

          if [ "$SUCCESS" -eq 0 ] && [ "$SKIPPED" -eq 0 ]; then
            echo "No video was successfully processed."
            exit 1
          fi

      - name: Generate page report
        if: always()
        run: |
          PAGE_DIR="ShizzleAI_Videos/Page_${PAGE_NUMBER}"
          mkdir -p "$PAGE_DIR"

          cat > "$PAGE_DIR/README.md" <<EOF
          # ShizzleAI - Page ${PAGE_NUMBER}

          - Page: ${PAGE_NUMBER}
          - Test mode: ${TEST_ONLY}
          - Successfully pushed: ${{ steps.download.outputs.success }}
          - Skipped: ${{ steps.download.outputs.skipped }}
          - Failed: ${{ steps.download.outputs.failed }}
          - Archive format: ZIP
          - Encryption: AES-256
          - Archive volume size: 45 MB

          Each video has its own encrypted ZIP archive.
          Keep all split archive parts together when extracting.
          EOF

          echo "Generated files:"
          find "$PAGE_DIR" -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Commit and push page report
        if: always()
        run: |
          set +e

          PAGE_DIR="ShizzleAI_Videos/Page_${PAGE_NUMBER}"
          BRANCH="${GITHUB_REF_NAME}"

          git add "$PAGE_DIR/README.md" "$PAGE_DIR/failed.txt"

          if git diff --cached --quiet; then
            echo "No report changes."
            exit 0
          fi

          git commit -m "Update ShizzleAI page ${PAGE_NUMBER} report" || exit 1

          ATTEMPT=1
          MAX_RETRIES=8

          while [ "$ATTEMPT" -le "$MAX_RETRIES" ]; do
            if git push origin "HEAD:${BRANCH}"; then
              echo "Report pushed successfully."
              exit 0
            fi

            echo "Report push failed. Fetching remote..."
            git fetch origin "$BRANCH" || true

            if ! git rebase "origin/${BRANCH}"; then
              git rebase --abort || true
            fi

            sleep $((ATTEMPT * 10))
            ATTEMPT=$((ATTEMPT + 1))
          done

          echo "Could not push page report."
          exit 1

      - name: Upload debug information
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shizzleai-debug-page-${{ inputs.page_number }}
          path: |
            debug/
            video_links.txt
          if-no-files-found: ignore
          retention-days: 3
