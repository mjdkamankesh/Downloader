name: ShizzleAI Multi-Page Downloader

on:
  workflow_dispatch:
    inputs:
      page_url:
        description: "URL صفحه اول جستجو"
        required: true
        type: string

      zip_password:
        description: "رمز فایل‌های ZIP"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: shizzle-download
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      PAGE_URL: ${{ inputs.page_url }}
      ZIP_PASSWORD: ${{ inputs.zip_password }}
      DOWNLOAD_DIR: ShizzleAI_Videos
      TEMP_DIR: downloads_tmp

    steps:
      # --------------------------------------------------
      # Checkout
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      # --------------------------------------------------
      # Git configuration
      # --------------------------------------------------
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git config http.version HTTP/1.1
          git config http.postBuffer 524288000
          git config core.compression 0

      # --------------------------------------------------
      # Install dependencies
      # --------------------------------------------------
      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            aria2 \
            p7zip-full \
            ffmpeg \
            python3 \
            python3-pip \
            git

          python -m pip install --upgrade pip
          python -m pip install playwright yt-dlp

          python -m playwright install --with-deps chromium

          mkdir -p "$DOWNLOAD_DIR"
          mkdir -p "$TEMP_DIR"

      # --------------------------------------------------
      # Scrape all pagination pages
      # --------------------------------------------------
      - name: Extract video links from all pages
        shell: bash
        run: |
          cat > extract_links.py <<'PY'
          import asyncio
          import re
          import sys
          from urllib.parse import urljoin, urlparse, parse_qs, urlencode, urlunparse

          from playwright.async_api import async_playwright

          START_URL = sys.argv[1]
          OUTPUT_FILE = "video_links.txt"

          def page_url(base_url, page_number):
              parsed = urlparse(base_url)
              params = parse_qs(parsed.query)
              params["page"] = [str(page_number)]

              query = urlencode(params, doseq=True)

              return urlunparse((
                  parsed.scheme,
                  parsed.netloc,
                  parsed.path,
                  parsed.params,
                  query,
                  parsed.fragment
              ))

          async def main():
              all_links = set()
              max_page = 1

              async with async_playwright() as p:
                  browser = await p.chromium.launch(
                      headless=True,
                      args=["--no-sandbox"]
                  )

                  page = await browser.new_page()
                  page.set_default_timeout(30000)

                  # First page: discover pagination range
                  print("Opening first page:", START_URL)

                  await page.goto(
                      START_URL,
                      wait_until="domcontentloaded",
                      timeout=60000
                  )

                  await page.wait_for_timeout(4000)

                  pagination_links = await page.locator("a[href]").evaluate_all("""
                      elements => elements.map(a => a.href)
                  """)

                  for href in pagination_links:
                      parsed = urlparse(href)
                      params = parse_qs(parsed.query)

                      if "page" in params:
                          try:
                              number = int(params["page"][0])
                              max_page = max(max_page, number)
                          except Exception:
                              pass

                  print("Detected maximum page:", max_page)

                  # Process every page
                  empty_pages = 0

                  for number in range(1, max_page + 1):
                      url = page_url(START_URL, number)

                      print(f"\\nProcessing page {number}/{max_page}")
                      print(url)

                      try:
                          await page.goto(
                              url,
                              wait_until="domcontentloaded",
                              timeout=60000
                          )

                          await page.wait_for_timeout(3000)

                          links = await page.locator(
                              "a.th.js-open-popup[href], a[href*='/video/']"
                          ).evaluate_all("""
                              elements => elements.map(a => a.href)
                          """)

                          page_links = set()

                          for link in links:
                              absolute = urljoin(url, link)

                              if "/video/" in absolute:
                                  page_links.add(absolute.split("?")[0])

                          before = len(all_links)
                          all_links.update(page_links)
                          added = len(all_links) - before

                          print(
                              f"Found {len(page_links)} links, "
                              f"{added} new links."
                          )

                          if not page_links:
                              empty_pages += 1
                          else:
                              empty_pages = 0

                          # Avoid unnecessary requests after consecutive empty pages
                          if empty_pages >= 2 and number > 1:
                              print("Two empty pages detected. Stopping.")
                              break

                      except Exception as error:
                          print(f"Page {number} failed: {error}")

                  await browser.close()

              with open(OUTPUT_FILE, "w", encoding="utf-8") as f:
                  for link in sorted(all_links):
                      f.write(link + "\\n")

              print("\\nTotal unique video links:", len(all_links))

          asyncio.run(main())
          PY

          python extract_links.py "$PAGE_URL"

          if [ ! -s video_links.txt ]; then
            echo "No video links were found."
            exit 1
          fi

      # --------------------------------------------------
      # Download and archive videos
      # --------------------------------------------------
      - name: Download videos and create encrypted archives
        shell: bash
        run: |
          set +e

          mkdir -p "$DOWNLOAD_DIR"
          mkdir -p "$TEMP_DIR"

          TOTAL=$(wc -l < video_links.txt)
          CURRENT=0
          SUCCESS=0
          SKIPPED=0
          FAILED=0

          touch failed.txt
          touch completed.txt

          while IFS= read -r URL || [ -n "$URL" ]; do

            [ -z "$URL" ] && continue

            CURRENT=$((CURRENT + 1))

            VIDEO_ID=$(echo "$URL" | grep -oE '/video/[0-9]+' | head -1 | cut -d/ -f3)

            if [ -z "$VIDEO_ID" ]; then
              echo "Could not extract video ID: $URL"
              FAILED=$((FAILED + 1))
              echo "$URL" >> failed.txt
              continue
            fi

            echo ""
            echo "========================================"
            echo "Video $CURRENT / $TOTAL"
            echo "ID: $VIDEO_ID"
            echo "$URL"
            echo "========================================"

            VIDEO_DIR="$TEMP_DIR/$VIDEO_ID"
            ZIP_PATH="$DOWNLOAD_DIR/${VIDEO_ID}.zip"
            PART_PREFIX="$ZIP_PATH.part-"
            COMPLETE_MARKER="$DOWNLOAD_DIR/.completed_${VIDEO_ID}"

            # Skip only when a completion marker and archive parts exist
            if [ -f "$COMPLETE_MARKER" ] && compgen -G "${PART_PREFIX}*" > /dev/null; then
              echo "Already completed. Skipping."
              SKIPPED=$((SKIPPED + 1))
              continue
            fi

            # Remove incomplete previous output
            rm -f "${PART_PREFIX}"*
            rm -f "$ZIP_PATH"
            rm -f "$COMPLETE_MARKER"

            rm -rf "$VIDEO_DIR"
            mkdir -p "$VIDEO_DIR"

            # Download using yt-dlp + aria2
            echo "Starting download..."

            yt-dlp \
              --no-warnings \
              --no-part \
              --no-overwrites \
              --retries 10 \
              --fragment-retries 10 \
              --downloader aria2c \
              --downloader-args "aria2c:-x 16 -s 16 -k 1M --file-allocation=none --retry-wait=5 --max-tries=10 --connect-timeout=30 --timeout=60" \
              --merge-output-format mp4 \
              -o "$VIDEO_DIR/%(id)s.%(ext)s" \
              "$URL"

            DOWNLOAD_STATUS=$?

            if [ "$DOWNLOAD_STATUS" -ne 0 ]; then
              echo "Download failed: $VIDEO_ID"
              echo "$URL" >> failed.txt
              FAILED=$((FAILED + 1))
              rm -rf "$VIDEO_DIR"
              continue
            fi

            VIDEO_FILE=$(find "$VIDEO_DIR" -maxdepth 1 -type f | head -1)

            if [ -z "$VIDEO_FILE" ] || [ ! -s "$VIDEO_FILE" ]; then
              echo "Downloaded file not found."
              echo "$URL" >> failed.txt
              FAILED=$((FAILED + 1))
              rm -rf "$VIDEO_DIR"
              continue
            fi

            # Create AES-256 encrypted ZIP
            echo "Creating AES-256 ZIP..."

            7z a \
              -tzip \
              "-p${ZIP_PASSWORD}" \
              -mem=AES256 \
              -mx=0 \
              -y \
              "$ZIP_PATH" \
              "$VIDEO_FILE"

            ZIP_STATUS=$?

            if [ "$ZIP_STATUS" -ne 0 ] || [ ! -s "$ZIP_PATH" ]; then
              echo "ZIP creation failed."
              echo "$URL" >> failed.txt
              FAILED=$((FAILED + 1))
              rm -f "$ZIP_PATH"
              rm -rf "$VIDEO_DIR"
              continue
            fi

            # Verify archive
            echo "Testing ZIP archive..."

            7z t "-p${ZIP_PASSWORD}" "$ZIP_PATH"

            TEST_STATUS=$?

            if [ "$TEST_STATUS" -ne 0 ]; then
              echo "ZIP verification failed."
              echo "$URL" >> failed.txt
              FAILED=$((FAILED + 1))
              rm -f "$ZIP_PATH"
              rm -rf "$VIDEO_DIR"
              continue
            fi

            # Split archive into 45 MB parts
            echo "Splitting archive into 45 MB parts..."

            split -b 45M -d -a 3 "$ZIP_PATH" "$PART_PREFIX"

            SPLIT_STATUS=$?

            if [ "$SPLIT_STATUS" -ne 0 ] || ! compgen -G "${PART_PREFIX}*" > /dev/null; then
              echo "Archive splitting failed."
              echo "$URL" >> failed.txt
              FAILED=$((FAILED + 1))
              rm -f "$ZIP_PATH"
              rm -f "${PART_PREFIX}"*
              rm -rf "$VIDEO_DIR"
              continue
            fi

            # Remove original ZIP and downloaded video
            rm -f "$ZIP_PATH"
            rm -rf "$VIDEO_DIR"

            # Mark as completed only after successful archive and split
            echo "$URL" > "$COMPLETE_MARKER"
            echo "$VIDEO_ID $URL" >> completed.txt

            SUCCESS=$((SUCCESS + 1))

            echo "Successfully archived: $VIDEO_ID"

          done < video_links.txt

          echo ""
          echo "========================================"
          echo "DOWNLOAD SUMMARY"
          echo "Total:   $TOTAL"
          echo "Success: $SUCCESS"
          echo "Skipped: $SKIPPED"
          echo "Failed:  $FAILED"
          echo "========================================"

          if [ "$SUCCESS" -eq 0 ] && [ "$SKIPPED" -eq 0 ]; then
            echo "No videos were successfully processed."
            exit 1
          fi

          exit 0

      # --------------------------------------------------
      # Generate README
      # --------------------------------------------------
      - name: Generate download report
        if: always()
        shell: bash
        run: |
          mkdir -p "$DOWNLOAD_DIR"

          cat > "$DOWNLOAD_DIR/README.md" <<'EOF'
          # ShizzleAI Video Archives

          Videos are stored as AES-256 encrypted ZIP archives.

          ## How to restore an archive

          1. Download all parts belonging to the same ZIP file.
          2. Put all parts in the same folder.
          3. Rebuild the original ZIP file.
          4. Open the ZIP file with 7-Zip.
          5. Enter the archive password.

          ### Windows CMD

          ```cmd
          copy /b "12345.zip.part-*" "12345.zip"
          ```

          ### Linux

          ```bash
          cat 12345.zip.part-* > 12345.zip
          ```

          ## Archive details

          - Encryption: AES-256
          - Archive format: ZIP
          - Part size: 45 MB
          - Downloader: yt-dlp + Aria2
          - Aria2 connections: 16
          EOF

          {
            echo ""
            echo "## Latest run"
            echo ""
            echo "- Date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "- Total links: $(wc -l < video_links.txt 2>/dev/null || echo 0)"
            echo "- Completed this run: $(wc -l < completed.txt 2>/dev/null || echo 0)"
            echo "- Failed this run: $(wc -l < failed.txt 2>/dev/null || echo 0)"
          } >> "$DOWNLOAD_DIR/README.md"

          if [ -s failed.txt ]; then
            cp failed.txt "$DOWNLOAD_DIR/failed.txt"
          fi

          if [ -s completed.txt ]; then
            cp completed.txt "$DOWNLOAD_DIR/completed.txt"
          fi

      # --------------------------------------------------
      # Commit all files
      # --------------------------------------------------
      - name: Commit files
        if: always()
        shell: bash
        run: |
          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Add ShizzleAI downloads"
          else
            echo "No changes to commit."
          fi

      # --------------------------------------------------
      # Robust push with retries
      # --------------------------------------------------
      - name: Push to GitHub with robust retries
        if: always()
        shell: bash
        run: |
          set -e

          BRANCH="${GITHUB_REF_NAME}"
          MAX_RETRIES=8
          ATTEMPT=1

          git config http.version HTTP/1.1
          git config http.postBuffer 524288000
          git config core.compression 0

          while [ "$ATTEMPT" -le "$MAX_RETRIES" ]; do
            echo ""
            echo "========================================"
            echo "Push attempt $ATTEMPT / $MAX_RETRIES"
            echo "========================================"

            # Preserve any staged, unstaged and untracked changes.
            OLD_STASH=$(git rev-parse -q --verify refs/stash 2>/dev/null || true)

            git stash push --include-untracked \
              -m "push-recovery-${GITHUB_RUN_ID}" || true

            NEW_STASH=$(git rev-parse -q --verify refs/stash 2>/dev/null || true)

            STASH_CREATED=false

            if [ -n "$NEW_STASH" ] && [ "$NEW_STASH" != "$OLD_STASH" ]; then
              STASH_CREATED=true
            fi

            # Get the latest remote branch.
            git fetch origin "$BRANCH"

            # Rebase local commits on top of remote commits.
            if ! git rebase "origin/$BRANCH"; then
              echo "Rebase failed. Aborting..."
              git rebase --abort || true

              if [ "$STASH_CREATED" = true ]; then
                git stash pop || true
              fi

              exit 1
            fi

            # Restore local changes.
            if [ "$STASH_CREATED" = true ]; then
              if ! git stash pop; then
                echo "Could not restore stashed changes."
                exit 1
              fi
            fi

            # Commit any remaining changes.
            git add -A

            if ! git diff --cached --quiet; then
              git commit -m "Save remaining ShizzleAI downloads"
            fi

            # Push without force.
            if git -c http.version=HTTP/1.1 \
                   -c http.postBuffer=524288000 \
                   push origin "HEAD:${BRANCH}"; then

              echo "Push successful."
              exit 0
            fi

            echo "Push failed. Will retry."

            WAIT_TIME=$((ATTEMPT * 10))

            echo "Waiting ${WAIT_TIME} seconds..."
            sleep "$WAIT_TIME"

            ATTEMPT=$((ATTEMPT + 1))
          done

          echo "Push failed after all retries."
          exit 1

      # --------------------------------------------------
      # Upload debug artifacts
      # --------------------------------------------------
      - name: Upload debug files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shizzle-download-report
          path: |
            video_links.txt
            completed.txt
            failed.txt
            extract_links.py
          if-no-files-found: ignore
          retention-days: 7
