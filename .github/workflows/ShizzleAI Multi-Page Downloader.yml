
name: ShizzleAI All Pages Downloader

on:
  workflow_dispatch:
    inputs:
      start_url:
        description: "Search page URL"
        required: true
        type: string
        default: "https://rule34gen.com/search/shizzleai-/?sort_by=post_date"

      test_only:
        description: "Test mode: download only one video"
        required: true
        type: boolean
        default: false

      zip_password:
        description: "Password for AES-256 ZIP files"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: shizzleai-download-${{ github.ref }}
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      TEST_ONLY: ${{ inputs.test_only }}
      ZIP_PASSWORD: ${{ inputs.zip_password }}
      START_URL: ${{ inputs.start_url }}

    steps:
      # IMPORTANT: fetch only the checkpoint file, not the 28+ GB of old video parts.
      - name: Checkout repository (checkpoint only)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
          sparse-checkout: |
            ShizzleAI_Videos/All_Pages/downloaded.txt
          sparse-checkout-cone-mode: false

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git config http.version HTTP/1.1
          git config http.postBuffer 524288000
          git config http.maxRequestBuffer 100M
          git config core.compression 0
          git config pack.windowMemory 100m
          git config pack.packSizeLimit 100m
          git config pack.threads 1

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            aria2 \
            p7zip-full \
            git \
            unzip \
            ffmpeg

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install playwright yt-dlp pyzipper

      - name: Install Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Prepare folders
        run: |
          mkdir -p temp_downloads
          mkdir -p debug
          mkdir -p ShizzleAI_Videos

          if [ -z "$ZIP_PASSWORD" ]; then
            echo "ZIP password is empty."
            exit 1
          fi

          if [ -z "$START_URL" ]; then
            echo "Start URL is empty."
            exit 1
          fi

          echo "Start URL: $START_URL"
          echo "Test mode: $TEST_ONLY"

      # First collect ALL video links from ALL pagination pages.
      - name: Extract all video links
        id: extract
        run: |
          cat > extract_links.py <<'PY'
          import os
          import re
          from urllib.parse import urljoin, urlparse
          from playwright.sync_api import sync_playwright

          START_URL = os.environ["START_URL"]
          MAX_PAGES = 30

          def video_id(url):
              match = re.search(r"/video/(\d+)", urlparse(url).path)
              return match.group(1) if match else None

          def is_video_url(url):
              parsed = urlparse(url)
              return (
                  parsed.hostname == "rule34gen.com"
                  and video_id(url) is not None
              )

          all_videos = {}
          visited_pages = set()

          with sync_playwright() as p:
              browser = p.chromium.launch(
                  headless=True,
                  args=["--no-sandbox", "--disable-dev-shm-usage"]
              )

              context = browser.new_context(
                  user_agent=(
                      "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                      "AppleWebKit/537.36 (KHTML, like Gecko) "
                      "Chrome/120.0.0.0 Safari/537.36"
                  )
              )

              page = context.new_page()
              page.set_default_timeout(30000)

              current_url = START_URL

              for page_number in range(1, MAX_PAGES + 1):
                  if not current_url or current_url in visited_pages:
                      break

                  visited_pages.add(current_url)

                  print("")
                  print("=" * 55)
                  print(f"Scanning page {page_number}: {current_url}")
                  print("=" * 55)

                  try:
                      response = page.goto(
                          current_url,
                          wait_until="domcontentloaded",
                          timeout=120000
                      )

                      if response:
                          print("HTTP status:", response.status)

                      page.wait_for_timeout(10000)

                      if page_number == 1:
                          page.screenshot(
                              path="debug/page.png",
                              full_page=True
                          )

                          with open(
                              "debug/page.html",
                              "w",
                              encoding="utf-8"
                          ) as f:
                              f.write(page.content())

                      links = page.locator(
                          "a.th.js-open-popup[href], a[href*='/video/']"
                      ).evaluate_all(
                          "els => els.map(a => a.href)"
                      )

                      page_count = 0

                      for link in links:
                          link = urljoin(current_url, link)

                          if not is_video_url(link):
                              continue

                          vid = video_id(link)

                          if vid not in all_videos:
                              all_videos[vid] = link
                              page_count += 1

                      print(f"New videos on this page: {page_count}")
                      print(f"Unique videos collected: {len(all_videos)}")

                      # Find the actual Next link first.
                      pagination = page.locator("a[href]").evaluate_all("""
                          els => els.map(a => ({
                              text: a.innerText.trim().toLowerCase(),
                              href: a.href,
                              rel: (a.getAttribute('rel') || '').toLowerCase()
                          }))
                      """)

                      next_url = None

                      for item in pagination:
                          if (
                              item["rel"] == "next"
                              or item["text"] in (
                                  "next",
                                  "next »",
                                  "next ›",
                                  "»",
                                  "›"
                              )
                          ):
                              candidate = item["href"]

                              if candidate and candidate != current_url:
                                  next_url = candidate
                                  break

                      # If there is no Next link, use the next numbered page.
                      if not next_url:
                          candidates = []

                          for item in pagination:
                              text = item["text"]

                              if text.isdigit():
                                  number = int(text)

                                  if number > page_number:
                                      candidates.append(
                                          (number, item["href"])
                                      )

                          if candidates:
                              candidates.sort(key=lambda x: x[0])
                              next_url = candidates[0][1]

                      if not next_url or next_url in visited_pages:
                          print("No further page found.")
                          break

                      current_url = next_url

                  except Exception as error:
                      print("Page extraction error:", error)

                      page.screenshot(
                          path=f"debug/error-page-{page_number}.png",
                          full_page=True
                      )

                      raise

              browser.close()

          with open("video_links.txt", "w", encoding="utf-8") as f:
              for vid, link in all_videos.items():
                  f.write(link + "\n")

          print("")
          print("=" * 55)
          print("EXTRACTION COMPLETED")
          print("Pages scanned:", len(visited_pages))
          print("Unique videos found:", len(all_videos))
          print("=" * 55)
          PY

          python extract_links.py

          if [ ! -s video_links.txt ]; then
            echo "No video links found."
            exit 1
          fi

          VIDEO_COUNT=$(wc -l < video_links.txt)

          echo "video_count=$VIDEO_COUNT" >> "$GITHUB_OUTPUT"

          echo "Total unique videos: $VIDEO_COUNT"
          cat video_links.txt

      # Only after extraction finishes, start downloading one by one.
      # Sparse checkout keeps all old video files on GitHub, but does NOT download them to this runner.
      - name: Download, ZIP and Push each video
        id: download
        shell: bash
        run: |
          set -Eeuo pipefail

          PAGE_DIR="ShizzleAI_Videos/All_Pages"
          mkdir -p "$PAGE_DIR" temp_downloads

          ARCHIVE="$PAGE_DIR/downloaded.txt"
          FAILED_FILE="$PAGE_DIR/failed.txt"

          # The only old file checked out from this folder is downloaded.txt.
          touch "$ARCHIVE"
          sort -u "$ARCHIVE" -o "$ARCHIVE"

          BRANCH="${GITHUB_REF_NAME}"
          MAX_RETRIES=8

          SUCCESS=0
          FAILED=0
          SKIPPED=0
          TOTAL=0

          echo "Checkpoint IDs: $(wc -l < "$ARCHIVE")"
          echo "Disk space before processing:"
          df -h "$GITHUB_WORKSPACE"

          while IFS= read -r URL || [ -n "$URL" ]; do
            [ -z "$URL" ] && continue

            TOTAL=$((TOTAL + 1))

            if [ "$TEST_ONLY" = "true" ] && [ "$TOTAL" -gt 1 ]; then
              echo "Test mode: first video processed. Stopping."
              break
            fi

            echo ""
            echo "======================================"
            echo "Video $TOTAL"
            echo "$URL"
            echo "======================================"

            VIDEO_ID=$(echo "$URL" | sed -nE 's#^.*/video/([0-9]+)/.*#\1#p')

            if [ -z "$VIDEO_ID" ]; then
              echo "Could not identify video ID."
              FAILED=$((FAILED + 1))
              printf '%s\n' "$URL" >> "$FAILED_FILE"
              continue
            fi

            # Exact ID match against the remote checkpoint.
            if grep -Fxq "$VIDEO_ID" "$ARCHIVE"; then
              echo "Already downloaded: $VIDEO_ID"
              SKIPPED=$((SKIPPED + 1))
              continue
            fi

            # Check available disk space before starting a potentially large download.
            FREE_KB=$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR==2 {print $4}')
            FREE_GB=$(awk -v kb="$FREE_KB" 'BEGIN {printf "%.2f", kb/1024/1024}')
            echo "Available disk space: ${FREE_GB} GB"

            if [ "$FREE_KB" -lt 3000000 ]; then
              echo "Less than 3 GB free. Stopping safely before the next download."
              break
            fi

            rm -f temp_downloads/*
            echo "Starting download..."

            # Hard limit prevents a stalled extractor/download from blocking the queue forever.
            if ! timeout --signal=TERM --kill-after=30s 15m yt-dlp \
              --no-overwrites \
              --retries 3 \
              --fragment-retries 3 \
              --file-access-retries 3 \
              --extractor-retries 3 \
              --socket-timeout 30 \
              --continue \
              --downloader aria2c \
              --downloader-args "aria2c:-x 16 -s 16 -k 1M --file-allocation=none --retry-wait=5 --max-tries=3 --connect-timeout=20 --timeout=30" \
              -f "bestvideo+bestaudio/best" \
              --merge-output-format mp4 \
              -o "temp_downloads/%(title).150B_%(id)s.%(ext)s" \
              "$URL"; then

              echo "Download failed or timed out: $VIDEO_ID"
              FAILED=$((FAILED + 1))
              printf '%s\n' "$URL" >> "$FAILED_FILE"
              rm -f temp_downloads/*
              continue
            fi

            shopt -s nullglob
            VIDEO_FILES=(
              temp_downloads/*.mp4
              temp_downloads/*.mkv
              temp_downloads/*.webm
              temp_downloads/*.mov
              temp_downloads/*.avi
            )

            if [ "${#VIDEO_FILES[@]}" -eq 0 ]; then
              echo "Downloaded file not found."
              FAILED=$((FAILED + 1))
              printf '%s\n' "$URL" >> "$FAILED_FILE"
              continue
            fi

            FILE="${VIDEO_FILES[0]}"
            BASENAME=$(basename "$FILE")
            NAME="${BASENAME%.*}"
            ZIP_PATH="$PAGE_DIR/${NAME}.zip"
            README_FILE="$PAGE_DIR/${NAME}_README.txt"

            echo "Downloaded: $BASENAME"
            echo "Creating AES-256 ZIP..."
            rm -f "$ZIP_PATH" "$ZIP_PATH".part-*

            if ! 7z a \
              -tzip \
              "-p${ZIP_PASSWORD}" \
              -mem=AES256 \
              -mx=0 \
              -y \
              "$ZIP_PATH" \
              "$FILE"; then

              echo "ZIP creation failed."
              FAILED=$((FAILED + 1))
              printf '%s\n' "$URL" >> "$FAILED_FILE"
              rm -f "$ZIP_PATH"
              continue
            fi

            if ! 7z t "-p${ZIP_PASSWORD}" "$ZIP_PATH"; then
              echo "ZIP verification failed."
              rm -f "$ZIP_PATH"
              FAILED=$((FAILED + 1))
              printf '%s\n' "$URL" >> "$FAILED_FILE"
              continue
            fi

            # Free the large source video BEFORE splitting the ZIP.
            # This avoids keeping the video + ZIP + ZIP parts on disk simultaneously.
            rm -f "$FILE"

            echo "Splitting ZIP into 45 MB parts..."
            if ! split -b 45M -d -a 3 \
              "$ZIP_PATH" \
              "$ZIP_PATH.part-"; then

              echo "ZIP splitting failed."
              rm -f "$ZIP_PATH" "$ZIP_PATH".part-*
              FAILED=$((FAILED + 1))
              printf '%s\n' "$URL" >> "$FAILED_FILE"
              continue
            fi

            PARTS=( "$ZIP_PATH".part-* )
            if [ "${#PARTS[@]}" -eq 0 ]; then
              echo "No ZIP parts created."
              rm -f "$ZIP_PATH"
              FAILED=$((FAILED + 1))
              printf '%s\n' "$URL" >> "$FAILED_FILE"
              continue
            fi

            # The split parts are now the final output; remove the full ZIP copy.
            rm -f "$ZIP_PATH"

            cat > "$README_FILE" <<EOF
          Video: $BASENAME
          Video ID: $VIDEO_ID
          Encryption: AES-256
          Split size: 45 MB

          Reassemble on Linux:
          cat "${NAME}.zip.part-"* > "${NAME}.zip"

          Open the reconstructed ZIP using 7-Zip and enter the password.
          EOF

            echo "ZIP parts:"
            ls -lh "$ZIP_PATH".part-*

            # Stage ONLY this video's new parts, its README, and the checkpoint.
            # --sparse permits adding new files outside the sparse checkout without checking out old files.
            git add --sparse -- "$README_FILE" "${PARTS[@]}"

            if git diff --cached --quiet; then
              echo "No staged changes; refusing to mark this video as complete."
              FAILED=$((FAILED + 1))
              continue
            fi

            # Record the ID in the same commit as the completed archive parts.
            printf '%s\n' "$VIDEO_ID" >> "$ARCHIVE"
            git add --sparse -- "$ARCHIVE"

            git commit -m "Add ShizzleAI video ${VIDEO_ID}"

            echo "Pushing video ${VIDEO_ID}..."
            ATTEMPT=1
            PUSHED=false

            while [ "$ATTEMPT" -le "$MAX_RETRIES" ]; do
              echo "Push attempt $ATTEMPT of $MAX_RETRIES"

              if git -c http.postBuffer=524288000 \
                     -c http.version=HTTP/1.1 \
                     push origin "HEAD:${BRANCH}"; then
                PUSHED=true
                break
              fi

              echo "Push failed. Fetching latest branch state..."
              if git fetch --depth=1 origin "$BRANCH"; then
                REMOTE_HEAD=$(git rev-parse FETCH_HEAD)
                LOCAL_HEAD=$(git rev-parse HEAD)

                if [ "$LOCAL_HEAD" = "$REMOTE_HEAD" ]; then
                  echo "Remote already contains this commit."
                  PUSHED=true
                  break
                fi

                # With concurrency enabled, a non-fast-forward should be unusual.
                # Stop rather than risk overwriting another run's checkpoint or files.
                if ! git merge-base --is-ancestor "$REMOTE_HEAD" "$LOCAL_HEAD"; then
                  echo "Remote branch changed independently. Stopping to protect existing files."
                  exit 1
                fi
              fi

              WAIT_TIME=$((ATTEMPT * 10))
              echo "Waiting ${WAIT_TIME} seconds..."
              sleep "$WAIT_TIME"
              ATTEMPT=$((ATTEMPT + 1))
            done

            if [ "$PUSHED" != "true" ]; then
              echo "Push failed after all retries."
              exit 1
            fi

            SUCCESS=$((SUCCESS + 1))
            echo "Video ${VIDEO_ID} successfully pushed."
            echo "Disk space after push:"
            df -h "$GITHUB_WORKSPACE"

          done < video_links.txt

          echo "success=$SUCCESS" >> "$GITHUB_OUTPUT"
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"
          echo "skipped=$SKIPPED" >> "$GITHUB_OUTPUT"

          echo ""
          echo "======================================"
          echo "FINAL SUMMARY"
          echo "Unique videos in list: $(wc -l < video_links.txt)"
          echo "Processed: $TOTAL"
          echo "Successfully pushed: $SUCCESS"
          echo "Already downloaded: $SKIPPED"
          echo "Failed: $FAILED"
          echo "======================================"

          if [ "$SUCCESS" -eq 0 ] && [ "$SKIPPED" -eq 0 ]; then
            echo "No video was successfully processed."
            exit 1
          fi

      - name: Generate page report
        if: always()
        run: |
          PAGE_DIR="ShizzleAI_Videos/All_Pages"
          mkdir -p "$PAGE_DIR"

          cat > "$PAGE_DIR/README.md" <<EOF
          # ShizzleAI - All Pages

          - Search URL: ${START_URL}
          - Test mode: ${TEST_ONLY}
          - Unique videos found: ${{ steps.extract.outputs.video_count }}
          - Successfully pushed: ${{ steps.download.outputs.success }}
          - Already downloaded: ${{ steps.download.outputs.skipped }}
          - Failed: ${{ steps.download.outputs.failed }}
          - Archive format: ZIP
          - Encryption: AES-256
          - Archive volume size: 45 MB

          All search pages are scanned before downloads begin.
          Only downloaded.txt is checked out from the archive folder; old video files remain on GitHub and are not downloaded to the runner.
          Each new video is downloaded, archived and pushed separately.
          yt-dlp is limited to 15 minutes per video.
          EOF

          echo "Generated report."

      - name: Commit and push page report
        if: always()
        run: |
          set -e

          PAGE_DIR="ShizzleAI_Videos/All_Pages"
          BRANCH="${GITHUB_REF_NAME}"

          # Add only the report and small status file; never stage the whole sparse folder.
          git add --sparse -- "$PAGE_DIR/README.md"
          if [ -f "$PAGE_DIR/failed.txt" ]; then
            git add --sparse -- "$PAGE_DIR/failed.txt"
          fi

          if git diff --cached --quiet; then
            echo "No report changes."
            exit 0
          fi

          git commit -m "Update ShizzleAI all-pages report"

          ATTEMPT=1
          MAX_RETRIES=8
          while [ "$ATTEMPT" -le "$MAX_RETRIES" ]; do
            if git push origin "HEAD:${BRANCH}"; then
              echo "Report pushed successfully."
              exit 0
            fi

            echo "Report push failed. Retrying..."
            sleep $((ATTEMPT * 10))
            ATTEMPT=$((ATTEMPT + 1))
          done

          echo "Could not push page report."
          exit 1

      - name: Upload debug information
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shizzleai-debug-all-pages
          path: |
            debug/
            video_links.txt
          if-no-files-found: ignore
          retention-days: 3
