
name: ShizzleAI Pages 1-6 Downloader

on:
  workflow_dispatch:
    inputs:
      page_number:
        description: "Select page"
        required: true
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"
          - "5"
          - "6"
        default: "1"

      test_only:
        description: "Test mode: download only one video"
        required: true
        type: boolean
        default: true

      zip_password:
        description: "Password for AES-256 ZIP files"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: shizzleai-download-${{ github.ref }}
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      PAGE_NUMBER: ${{ inputs.page_number }}
      TEST_ONLY: ${{ inputs.test_only }}
      ZIP_PASSWORD: ${{ inputs.zip_password }}
      START_URL: https://rule34gen.com/search/shizzleai-/?sort_by=post_date

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git config http.version HTTP/1.1
          git config http.postBuffer 524288000
          git config http.maxRequestBuffer 100M
          git config core.compression 0
          git config pack.windowMemory 100m
          git config pack.packSizeLimit 100m
          git config pack.threads 1

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            aria2 \
            p7zip-full \
            git \
            unzip \
            ffmpeg

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install playwright yt-dlp pyzipper

      - name: Install Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Prepare folders
        run: |
          mkdir -p temp_downloads
          mkdir -p debug
          mkdir -p "ShizzleAI_Videos/Page_${PAGE_NUMBER}"

          echo "Selected page: ${PAGE_NUMBER}"
          echo "Test mode: ${TEST_ONLY}"

      - name: Extract video links
        run: |
          cat > extract_links.py <<'PY'
          import os
          from playwright.sync_api import sync_playwright

          page_number = int(os.environ["PAGE_NUMBER"])
          start_url = os.environ["START_URL"]

          if page_number == 1:
              url = start_url
          else:
              separator = "&" if "?" in start_url else "?"
              url = f"{start_url}{separator}page={page_number}"

          print(f"Opening: {url}")

          links = []

          with sync_playwright() as p:
              browser = p.chromium.launch(
                  headless=True,
                  args=["--no-sandbox", "--disable-dev-shm-usage"]
              )

              context = browser.new_context(
                  user_agent=(
                      "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                      "AppleWebKit/537.36 (KHTML, like Gecko) "
                      "Chrome/120.0.0.0 Safari/537.36"
                  )
              )

              page = context.new_page()
              page.set_default_timeout(30000)

              try:
                  page.goto(
                      url,
                      wait_until="domcontentloaded",
                      timeout=120000
                  )
                  page.wait_for_timeout(10000)

                  page.screenshot(
                      path="debug/page.png",
                      full_page=True
                  )

                  with open("debug/page.html", "w", encoding="utf-8") as f:
                      f.write(page.content())

                  selectors = [
                      "a.th.js-open-popup[href]",
                      "a[href*='/video/']"
                  ]

                  for selector in selectors:
                      elements = page.locator(selector).all()

                      for element in elements:
                          href = element.get_attribute("href")

                          if not href:
                              continue

                          if href.startswith("/"):
                              href = "https://rule34gen.com" + href

                          if "/video/" in href and href not in links:
                              links.append(href)

              except Exception as e:
                  print(f"Page extraction error: {e}")
                  page.screenshot(
                      path="debug/error.png",
                      full_page=True
                  )

              finally:
                  browser.close()

          with open("video_links.txt", "w", encoding="utf-8") as f:
              for link in links:
                  f.write(link + "\n")

          print(f"Found {len(links)} video links")
          PY

          python extract_links.py

          if [ ! -s video_links.txt ]; then
            echo "No video links found."
            exit 1
          fi

          echo "Extracted links:"
          cat video_links.txt

      - name: Download videos with Aria2
        id: download
        run: |
          set +e

          PAGE_DIR="ShizzleAI_Videos/Page_${PAGE_NUMBER}"
          mkdir -p "$PAGE_DIR"
          mkdir -p temp_downloads

          if [ "$TEST_ONLY" = "true" ]; then
            ARCHIVE="$RUNNER_TEMP/shizzle-test-archive.txt"
            echo "TEST MODE: only the first video will be downloaded."
          else
            ARCHIVE="$PAGE_DIR/downloaded.txt"
            touch "$ARCHIVE"
            echo "FULL MODE: downloading all available videos."
          fi

          touch "$ARCHIVE"

          SUCCESS=0
          FAILED=0
          TOTAL=0

          while IFS= read -r URL || [ -n "$URL" ]; do
            [ -z "$URL" ] && continue

            TOTAL=$((TOTAL + 1))

            if [ "$TEST_ONLY" = "true" ] && [ "$TOTAL" -gt 1 ]; then
              break
            fi

            echo ""
            echo "======================================"
            echo "Video $TOTAL"
            echo "$URL"
            echo "======================================"

            if yt-dlp \
              --no-overwrites \
              --download-archive "$ARCHIVE" \
              --retries 10 \
              --fragment-retries 10 \
              --file-access-retries 10 \
              --extractor-retries 5 \
              --socket-timeout 60 \
              --continue \
              --downloader aria2c \
              --downloader-args "aria2c:-x 16 -s 16 -k 1M --file-allocation=none --retry-wait=5 --max-tries=10 --connect-timeout=30 --timeout=60" \
              -f "bestvideo+bestaudio/best" \
              --merge-output-format mp4 \
              -o "temp_downloads/%(title).150B_%(id)s.%(ext)s" \
              "$URL"; then

              SUCCESS=$((SUCCESS + 1))
              echo "RESULT: SUCCESS"

            else
              FAILED=$((FAILED + 1))
              echo "$URL" >> "$PAGE_DIR/failed.txt"
              echo "RESULT: FAILED"
            fi

          done < video_links.txt

          echo ""
          echo "======================================"
          echo "Download summary"
          echo "Successful: $SUCCESS"
          echo "Failed: $FAILED"
          echo "======================================"

          echo "success=$SUCCESS" >> "$GITHUB_OUTPUT"
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"

          if [ "$SUCCESS" -eq 0 ]; then
            echo "No video was downloaded successfully."
            exit 1
          fi

      - name: Create AES-256 ZIP archives
        if: always()
        run: |
          set -e

          PAGE_DIR="ShizzleAI_Videos/Page_${PAGE_NUMBER}"
          mkdir -p "$PAGE_DIR"

          shopt -s nullglob

          for FILE in temp_downloads/*; do
            [ -f "$FILE" ] || continue

            case "$FILE" in
              *.mp4|*.mkv|*.webm|*.mov|*.avi)
                ;;
              *)
                continue
                ;;
            esac

            BASENAME=$(basename "$FILE")
            NAME="${BASENAME%.*}"
            ZIP_PATH="$PAGE_DIR/$NAME.zip"

            echo "Creating encrypted archive: $ZIP_PATH"

            7z a \
              -tzip \
              -v45m \
              -p"${ZIP_PASSWORD}" \
              -mem=AES256 \
              -mx=0 \
              "$ZIP_PATH" \
              "$FILE"

            if [ $? -eq 0 ]; then
              echo "Archive created successfully."

              cat > "$PAGE_DIR/${NAME}_README.txt" <<EOF
          Video: $BASENAME
          Archive: $NAME.zip
          Encryption: AES-256
          Split size: 45 MB
          Password: The password entered when starting the workflow.
          Extraction: Keep all ZIP volume parts together before extraction.
          EOF
            else
              echo "Archive creation failed for $FILE"
              exit 1
            fi
          done

          echo "Archive creation completed."

      - name: Generate page report
        if: always()
        run: |
          PAGE_DIR="ShizzleAI_Videos/Page_${PAGE_NUMBER}"
          mkdir -p "$PAGE_DIR"

          cat > "$PAGE_DIR/README.md" <<EOF
          # ShizzleAI - Page ${PAGE_NUMBER}

          - Page: ${PAGE_NUMBER}
          - Test mode: ${TEST_ONLY}
          - Downloaded successfully: ${{ steps.download.outputs.success }}
          - Failed downloads: ${{ steps.download.outputs.failed }}
          - Archive format: ZIP
          - Encryption: AES-256
          - Archive volume size: 45 MB

          ## Important

          Each video has its own encrypted ZIP archive.
          Keep all split archive parts together when extracting.
          EOF

          echo ""
          echo "Generated files:"
          find "$PAGE_DIR" -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Prepare files for Git
        if: always()
        run: |
          git add "ShizzleAI_Videos/Page_${PAGE_NUMBER}"

          if ! git diff --cached --quiet; then
            git status --short
          else
            echo "No repository changes to commit."
          fi

      - name: Commit and push with retries
        if: always()
        run: |
          set +e

          BRANCH="${GITHUB_REF_NAME}"
          MAX_RETRIES=8
          ATTEMPT=1

          git add "ShizzleAI_Videos/Page_${PAGE_NUMBER}"

          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi

          git commit -m "Add ShizzleAI page ${PAGE_NUMBER} downloads"

          if [ $? -ne 0 ]; then
            echo "Commit failed."
            exit 1
          fi

          while [ "$ATTEMPT" -le "$MAX_RETRIES" ]; do
            echo "Push attempt $ATTEMPT of $MAX_RETRIES"

            git -c http.postBuffer=524288000 \
                -c http.version=HTTP/1.1 \
                push origin "HEAD:${BRANCH}"

            if [ $? -eq 0 ]; then
              echo "Push successful."
              exit 0
            fi

            echo "Push failed. Fetching remote changes..."

            git fetch origin "$BRANCH"

            if [ $? -eq 0 ]; then
              git rebase "origin/${BRANCH}"

              if [ $? -ne 0 ]; then
                echo "Rebase failed. Trying to abort..."
                git rebase --abort
              fi
            fi

            WAIT_TIME=$((ATTEMPT * 10))
            echo "Waiting ${WAIT_TIME} seconds before retry..."
            sleep "$WAIT_TIME"

            ATTEMPT=$((ATTEMPT + 1))
          done

          echo "Push failed after all retries."
          exit 1

      - name: Upload debug information
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shizzleai-debug-page-${{ inputs.page_number }}
          path: |
            debug/
            video_links.txt
          if-no-files-found: ignore
          retention-days: 3
